<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="author" content="Bruno Nunes da Silva">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open Hands – Gestão para ONGs</title>
<style>
:root{--bg:#f2f2f2;--cd:#fff;--tx:#1d1d1d;--mu:#6b6b6b;--pr:#0078d7;--pt:#fff;--bd:#c8c8c8;--dg:#e51400}
@media(prefers-color-scheme:dark){:root{--bg:#1d1d1d;--cd:#2b2b2b;--tx:#fff;--mu:#a6a6a6;--pr:#1ba1e2;--bd:#555;--dg:#ff6b57}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 "Segoe UI","Selawik","Helvetica Neue",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:1040px;margin:0 auto;padding:20px 16px 60px}
h2,h3{font-weight:300;margin:26px 0 10px}h2{font-size:28px}h3{font-size:22px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:8px}
.top b{font-size:40px;font-weight:300;line-height:1.1}
small,.mu{color:var(--mu)}small{display:block;font-size:14px}
button,input,select{font:inherit}
button{cursor:pointer;border-radius:0;padding:8px 18px;border:2px solid var(--pr);background:var(--pr);color:var(--pt)}
button:hover{filter:brightness(1.12)}button:active{transform:scale(.97)}
button.b2{background:transparent;color:var(--tx);border-color:var(--bd)}button.dg{border-color:var(--dg);color:var(--dg)}
button:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
nav{display:flex;gap:18px;overflow-x:auto;margin:6px 0 10px}
nav button{background:none;border:0;color:var(--tx);font-size:24px;font-weight:300;opacity:.45;padding:0;white-space:nowrap}
nav button.on{opacity:1}
.tiles,.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:150px;gap:8px;margin:10px 0}
.kp{grid-auto-rows:120px}
.t,.kp div{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;padding:12px 14px;border:0;color:#fff}
.t b,.kp b{font-size:44px;font-weight:300;line-height:1}
.t span{font-size:16px}.t small{color:rgba(255,255,255,.85)}
.w2{grid-column:span 2}
.c0{background:#00aba9}.c1{background:#60a917}.c2{background:#1ba1e2}.c3{background:#fa6800}.c4{background:#d80073}.c5{background:#6a00ff}.c6{background:#c17f00}.c7{background:#647687}.neg{background:#e51400}
.kp div:nth-child(1){background:#00aba9}.kp div:nth-child(2){background:#60a917}.kp div:nth-child(3){background:#1ba1e2}.kp div:nth-child(4){background:#fa6800}.kp div:nth-child(5){background:#d80073}
.card{background:var(--cd);border-left:8px solid var(--pr);padding:14px 16px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.tw{overflow-x:auto;background:var(--cd)}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--bd);vertical-align:top}
th{font-size:14px;font-weight:400;color:var(--mu)}tr:hover td{background:rgba(127,127,127,.1)}.ac{white-space:nowrap}.ac button{padding:3px 10px;margin-right:4px}
input,select{width:100%;padding:8px 10px;border-radius:0;border:2px solid var(--bd);background:var(--cd);color:var(--tx)}
input:focus,select:focus{border-color:var(--pr);outline:0}
label{display:block;margin:12px 0 0;font-size:14px;color:var(--mu)}label input,label select{margin-top:3px}
dialog{border:0;border-radius:0;padding:22px;width:min(460px,94vw);background:var(--cd);color:var(--tx)}
dialog::backdrop{background:rgba(0,0,0,.55)}dialog h3{margin:0 0 6px;font-size:26px}
#toast{position:fixed;left:0;right:0;bottom:0;background:var(--pr);color:#fff;padding:12px 18px;display:none;z-index:9}
footer{margin-top:30px;font-size:13px;color:var(--mu)}
#splash{position:fixed;inset:0;z-index:20;background:#00aba9;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;transition:opacity .5s,transform .5s}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash h1{font-size:clamp(44px,12vw,84px);font-weight:300;margin:0;line-height:1}
#splash p{margin:0;font-size:20px;font-weight:300}
#splash .ld{width:min(240px,60vw);height:4px;background:rgba(255,255,255,.3);margin-top:28px;overflow:hidden}
#splash .ld i{display:block;height:100%;width:40%;background:#fff;animation:ld 1.1s ease-in-out infinite}
#splash .by{position:absolute;bottom:28px;left:0;right:0;font-size:22px;font-weight:300}
#splash .by b{font-weight:600}
@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@media(prefers-reduced-motion:reduce){#splash .ld i{animation:none;width:100%}#splash{transition:none}}
#credit{max-width:1040px;margin:0 auto;padding:0 16px 40px;font-size:20px;font-weight:300;color:var(--mu)}
#credit b{color:var(--tx);font-weight:600}
@media print{nav,.row,.top button,footer,.noprint{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div id="splash" role="status"><h1>Open Hands</h1><p>Gestão para ONGs</p><div class="ld"><i></i></div><div class="by">Criado por <b>Bruno Nunes da Silva</b></div></div>
<main id="app"></main>
<div id="credit">Criado por <b>Bruno Nunes da Silva</b></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<script>
const $=(s,e=document)=>e.querySelector(s),K='maos_abertas_v1';
let DB={orgs:[]};try{DB=JSON.parse(localStorage.getItem(K))||DB}catch(e){}
let cur=sessionStorage.getItem('cur'),tab='dash',q='',R={f:'',t:''};
const TABS=[['dash','Painel'],['families','Assistidos'],['donations','Doações'],['deliveries','Entregas'],['volunteers','Voluntários'],['rep','Relatório'],['cfg','Ajustes']];
const ENT={
 families:{f:[['nome','Nome','text',1],['doc','CPF ou documento','text'],['tel','Telefone','tel'],['membros','Pessoas na casa','number'],['end','Endereço','text'],['obs','Observações','text']]},
 donations:{f:[['data','Data','date',1],['doador','Doador','text'],['item','Item','text',1],['qtd','Quantidade','number',1],['obs','Observações','text']]},
 deliveries:{f:[['data','Data','date',1],['fam','Assistido','sel:families',1],['item','Item','text',1],['qtd','Quantidade','number',1]]},
 volunteers:{f:[['nome','Nome','text',1],['tel','Telefone','tel'],['func','Função','text'],['disp','Disponibilidade','text']]}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){toast('Sem espaço para salvar. Exporte um backup.')}};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const O=()=>DB.orgs.find(o=>o.id===cur);
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2800)}
async function hash(p,salt){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function modal(title,body,ok,lbl='Salvar'){const d=$('#dlg');d.innerHTML=`<form method="dialog"><h3>${title}</h3>${body}<div class="row"><button type="button" class="b2" id="mx">Cancelar</button><button>${lbl}</button></div></form>`;
 $('#mx',d).onclick=()=>d.close();$('form',d).onsubmit=async e=>{e.preventDefault();if(await ok(Object.fromEntries(new FormData(e.target)))!==false)d.close()};d.showModal()}
function dl(t,n,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),999)}
function csv(head,rows,name){const c=s=>{s=String(s??'');if(/^[=+\-@]/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'};dl('\ufeff'+[head,...rows].map(r=>r.map(c).join(';')).join('\n'),name+'.csv','text/csv')}
const fmt=d=>d?d.split('-').reverse().join('/'):'';
const show=(o,k,t,r)=>t.startsWith('sel:')?((o[t.slice(4)].find(x=>x.id==r[k])||{}).nome||'—'):t=='date'?fmt(r[k]):(r[k]??'');

function render(){const a=$('#app'),o=O();if(cur&&!o)cur=null;
 if(!o){a.innerHTML=`<div class="top"><div><b>Open Hands</b><small>Cada ONG gerencia somente os seus dados</small></div></div>
 <div class="tiles"><button class="t c7 w2" data-a="new"><b>+</b><span>Cadastrar ONG</span></button><button class="t c4" data-a="imp"><b>↥</b><span>Importar ONG</span></button>${DB.orgs.map((x,i)=>`<button class="t c${i%4}" data-a="enter" data-id="${esc(x.id)}"><b>${x.families.length}</b><span>${esc(x.nome)}<small>${esc(x.cidade||'')} · assistidos</small></span></button>`).join('')}</div><input type="file" id="fi" accept=".json" hidden>${DB.orgs.length?'':'<p class="mu">Nenhuma ONG cadastrada. Comece cadastrando a primeira.</p>'}
 <footer>Os dados ficam salvos apenas neste navegador. Exporte backups com frequência e cadastre só o necessário (LGPD).</footer>`;return}
 a.innerHTML=`<div class="top"><div><b>${esc(o.nome)}</b><small>${esc(o.cidade||'')}</small></div><button class="b2" data-a="out">Sair</button></div>
 <nav>${TABS.map(([k,l])=>`<button class="${tab==k?'on':''}" data-a="tab" data-id="${k}">${l}</button>`).join('')}</nav><section>${view(o)}</section>`}

function view(o){if(tab=='dash')return dash(o);if(tab=='rep')return rep(o);if(tab=='cfg')return cfg(o);
 return`<div class="row"><button data-a="add" data-e="${tab}">Novo registro</button><button class="b2" data-a="csv" data-e="${tab}">Exportar CSV</button><input id="q" placeholder="Buscar" value="${esc(q)}" style="max-width:240px"></div><div id="tb">${tbl(o,tab)}</div>`}
function tbl(o,e){const E=ENT[e],s=q.toLowerCase(),rows=o[e].filter(r=>!s||E.f.some(([k,,t])=>String(show(o,k,t,r)).toLowerCase().includes(s))).reverse();
 return rows.length?`<div class="tw"><table><tr>${E.f.map(f=>`<th>${f[1]}</th>`).join('')}<th></th></tr>${rows.map(r=>`<tr>${E.f.map(([k,,t])=>`<td>${esc(show(o,k,t,r))}</td>`).join('')}<td class="ac"><button class="b2" data-a="edit" data-e="${e}" data-id="${esc(r.id)}">Editar</button><button class="b2 dg" data-a="del" data-e="${e}" data-id="${esc(r.id)}">Excluir</button></td></tr>`).join('')}</table></div>`:'<p class="mu">Nenhum registro encontrado. Use “Novo registro” para adicionar.</p>'}

function stock(o){const m={};const add=(r,s)=>{const k=r.item.trim().toLowerCase();m[k]=m[k]||{n:r.item.trim(),q:0};m[k].q+=s*Number(r.qtd||0)};o.donations.forEach(r=>add(r,1));o.deliveries.forEach(r=>add(r,-1));return Object.values(m)}
function dash(o){const st=stock(o),T=(n,l,t,c,w)=>`<button class="t ${c} ${w||''}" data-a="tab" data-id="${t}"><b>${n}</b><span>${l}</span></button>`,Q=(l,e,c)=>`<button class="t ${c}" data-a="add" data-e="${e}"><b>+</b><span>${l}</span></button>`;
 return`<div class="tiles">${T(o.families.length,'Assistidos','families','c0','w2')}${T(o.donations.length,'Doações','donations','c1')}${T(o.deliveries.length,'Entregas','deliveries','c2')}${T(o.volunteers.length,'Voluntários','volunteers','c3')}${Q('Novo assistido','families','c4')}${Q('Nova doação','donations','c5')}${Q('Nova entrega','deliveries','c6')}${T('↗','Relatório','rep','c7')}</div>
 <h2>Estoque</h2>${st.length?`<div class="tiles">${st.map(x=>`<div class="t ${x.q<0?'neg':'c1'}"><b>${x.q}</b><span>${esc(x.n)}${x.q<0?'<small>entregas acima das doações</small>':''}</span></div>`).join('')}</div>`:'<p class="mu">Registre doações e entregas para ver o saldo.</p>'}`}

function calc(o){const ok=r=>(!R.f||r.data>=R.f)&&(!R.t||r.data<=R.t),d=o.donations.filter(ok),v=o.deliveries.filter(ok),s=a=>a.reduce((n,r)=>n+Number(r.qtd||0),0);return{d,v,sd:s(d),sv:s(v),fam:new Set(v.map(r=>r.fam)).size}}
function rep(o){const c=calc(o);return`<div class="row noprint"><label style="margin:0">De <input type="date" data-r="f" value="${R.f}"></label><label style="margin:0">Até <input type="date" data-r="t" value="${R.t}"></label><button data-a="print">Imprimir</button><button class="b2" data-a="repcsv">Exportar CSV</button></div>
 <h3>Relatório de prestação de contas – ${esc(o.nome)}</h3><p class="mu">Período: ${R.f?fmt(R.f):'início'} a ${R.t?fmt(R.t):'hoje'}</p>
 <div class="kp"><div><b>${c.d.length}</b>doações recebidas</div><div><b>${c.sd}</b>unidades doadas</div><div><b>${c.v.length}</b>entregas</div><div><b>${c.sv}</b>unidades entregues</div><div><b>${c.fam}</b>famílias atendidas</div></div>`}

function cfg(o){return`<div class="card"><div><b>Backup da ONG</b><small>Baixe um arquivo para guardar ou levar a outro aparelho.</small></div><button data-a="bak">Exportar .json</button></div>
 <div class="card"><div><b>Alterar senha</b></div><button class="b2" data-a="pw">Alterar</button></div>
 <div class="card"><div><b>Excluir esta ONG</b><small>Apaga todos os dados deste navegador.</small></div><button class="b2 dg" data-a="rm">Excluir</button></div>`}

function fld([k,l,t,req],r,o){const v=r[k]??(t=='date'?today():'');
 if(t.startsWith('sel:'))return`<label>${l}<select name="${k}" ${req?'required':''}><option value="">Selecione</option>${o[t.slice(4)].map(x=>`<option value="${esc(x.id)}" ${x.id==v?'selected':''}>${esc(x.nome)}</option>`).join('')}</select></label>`;
 return`<label>${l}<input name="${k}" type="${t}" value="${esc(v)}" ${req?'required':''} ${t=='number'?'min="0" step="any"':''}></label>`}
function edit(e,id){const o=O(),r=id?o[e].find(x=>x.id==id):{};
 if(e=='deliveries'&&!o.families.length){toast('Cadastre um assistido antes de registrar entregas');return}
 modal(id?'Editar registro':'Novo registro',ENT[e].f.map(f=>fld(f,r,o)).join(''),v=>{
  if(e=='families'){const d=v.doc.replace(/\D/g,''),n=v.nome.trim().toLowerCase(),
   dup=o.families.find(x=>x.id!=id&&((d&&(x.doc||'').replace(/\D/g,'')==d)||(x.nome.trim().toLowerCase()==n&&x.tel&&x.tel==v.tel)));
   if(dup&&!confirm('Já existe um cadastro parecido: '+dup.nome+'. Salvar mesmo assim?'))return false}
  if(id)Object.assign(r,v);else o[e].push({id:uid(),...v});save();render();toast('Registro salvo')})}
function del(e,id){const o=O();if(e=='families'&&o.deliveries.some(d=>d.fam==id)){toast('Este assistido tem entregas. Exclua as entregas primeiro.');return}
 if(confirm('Excluir este registro?')){o[e]=o[e].filter(x=>x.id!=id);save();render();toast('Registro excluído')}}
const csvOf=(o,e)=>csv(ENT[e].f.map(f=>f[1]),o[e].map(r=>ENT[e].f.map(([k,,t])=>show(o,k,t,r))),e+'-'+today());

async function newOrg(v){if(v.senha.length<6){toast('A senha precisa ter ao menos 6 caracteres');return false}
 const id=uid();DB.orgs.push({id,nome:v.nome.trim(),cidade:v.cidade,resp:v.resp,h:await hash(v.senha,id),families:[],donations:[],deliveries:[],volunteers:[]});save();render();toast('ONG cadastrada')}
function enter(id){const o=DB.orgs.find(x=>x.id==id);modal('Entrar em '+esc(o.nome),'<label>Senha<input name="s" type="password" required autofocus></label>',async v=>{
 if(await hash(v.s,id)!==o.h){toast('Senha incorreta');return false}cur=id;sessionStorage.setItem('cur',id);tab='dash';q='';render()},'Entrar')}
function pw(rm){const o=O();modal(rm?'Excluir ONG':'Alterar senha',`<label>Senha atual<input name="a" type="password" required></label>${rm?'':'<label>Nova senha<input name="n" type="password" required minlength="6"></label>'}`,async v=>{
 if(await hash(v.a,o.id)!==o.h){toast('Senha atual incorreta');return false}
 if(rm){if(!confirm('Excluir '+o.nome+' e todos os seus dados?'))return false;DB.orgs=DB.orgs.filter(x=>x.id!=o.id);cur=null;sessionStorage.removeItem('cur');save();render();toast('ONG excluída')}
 else{o.h=await hash(v.n,o.id);save();toast('Senha alterada')}},rm?'Excluir':'Alterar')}
function imp(file){const fr=new FileReader();fr.onload=()=>{try{const x=JSON.parse(fr.result);if(!x||!/^[a-z0-9]+$/.test(x.id||'')||!x.nome||!x.h)throw 0;
 const n={id:x.id,nome:String(x.nome),cidade:String(x.cidade||''),resp:String(x.resp||''),h:String(x.h)};['families','donations','deliveries','volunteers'].forEach(k=>n[k]=Array.isArray(x[k])?x[k]:[]);
 const i=DB.orgs.findIndex(o=>o.id==n.id);if(i>=0&&!confirm('Essa ONG já existe aqui. Substituir os dados atuais?'))return;
 if(i>=0)DB.orgs[i]=n;else DB.orgs.push(n);save();render();toast('ONG importada')}catch(e){toast('Arquivo inválido')}};fr.readAsText(file)}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const{a,id,e:en}=b.dataset,o=O();
 const A={new:()=>modal('Cadastrar ONG','<label>Nome da ONG<input name="nome" required></label><label>Cidade<input name="cidade"></label><label>Responsável<input name="resp"></label><label>Senha (mín. 6 caracteres)<input name="senha" type="password" required minlength="6"></label>',newOrg,'Cadastrar'),
 imp:()=>$('#fi').click(),enter:()=>enter(id),out:()=>{cur=null;sessionStorage.removeItem('cur');render()},tab:()=>{tab=id;q='';render()},
 add:()=>edit(en),edit:()=>edit(en,id),del:()=>del(en,id),csv:()=>csvOf(o,en),print:()=>print(),
 repcsv:()=>{const c=calc(o);csv(['Tipo','Data','Pessoa','Item','Quantidade'],[...c.d.map(r=>['Doação',fmt(r.data),r.doador,r.item,r.qtd]),...c.v.map(r=>['Entrega',fmt(r.data),show(o,'fam','sel:families',r),r.item,r.qtd])],'relatorio-'+today())},
 bak:()=>dl(JSON.stringify(o,null,1),'backup-'+o.nome.replace(/\W+/g,'-').toLowerCase()+'-'+today()+'.json','application/json'),pw:()=>pw(0),rm:()=>pw(1)};A[a]&&A[a]()});
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;$('#tb').innerHTML=tbl(O(),tab)}});
document.addEventListener('change',e=>{if(e.target.dataset.r){R[e.target.dataset.r]=e.target.value;render()}if(e.target.id=='fi'&&e.target.files[0]){imp(e.target.files[0]);e.target.value=''}});
render();
(function(){const s=$('#splash'),done=()=>{s.classList.add('out');setTimeout(()=>s.remove(),600)};setTimeout(done,1800);s.addEventListener('click',done)})();
</script>
</body>
</html>
